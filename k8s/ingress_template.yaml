apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookins-io-ingress
  namespace: bookins-io
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: "nginx"
  tls:
  - hosts:
    - bookins.io
    secretName: bookins-io-tls-secret # cert-manager will create this secret
  rules:
  - host: bookins.io
    http:
      paths:
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: biprod-be-service
            port:
              name: http
      - path: /
        pathType: Prefix
        backend:
          service:
            name: biprod-fe-service
            port:
              name: http