server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Handle large Auth0 JWTs carrying public + private PermSet claims in Authorization headers
    large_client_header_buffers 4 32k;
    client_max_body_size 10m;

    # Static JS/CSS assets: return 404 if a stale hash is requested (never fall back to index.html)
    location ~* \.(?:js|mjs|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Reverse-proxy API requests to the internal Express + MongoDB backend on 127.0.0.1:3000
    # Only Nginx (:80) is exposed publicly; Express is bound strictly to localhost inside the pod.
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_buffer_size 32k;
        proxy_buffers 4 32k;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA fallback: let the Angular router handle client-side routes (/home, /join, etc.)
    location / {
        try_files $uri $uri/ /index.html;

        # Never cache index.html so browsers always pick up the newest hashed bundles
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
